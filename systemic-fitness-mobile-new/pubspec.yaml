name: workout
description: A new Flutter application.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.0
  json_annotation: ^4.9.0
  step_progress_indicator: ^1.0.2

  numberpicker: ^2.1.2
  flutter_widget_from_html_core: ^0.15.2
  country_state_city_picker: ^1.2.8
  palette_generator: ^0.3.3+4
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.2
  lottie: ^3.1.3
  share_plus: ^10.1.0
  feedback: ^3.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  flutter_tts: ^4.0.2
  intro_slider: ^4.2.1
  wakelock_plus: ^1.2.8
  flutter_local_notifications:
  http:
  carousel_slider: ^5.0.0
  fluttertoast: ^8.2.10
  scroll_to_index: ^3.0.1
#  admob_flutter: ^2.0.0
  google_mobile_ads: ^5.2.0

  country_code_picker: ^3.1.0
  device_info_plus:
  figma_squircle: ^0.6.3
  path_provider: ^2.1.4
  connectivity_plus: ^6.1.0
  rxdart: ^0.28.0
  timezone: ^0.9.4
  flutter_email_sender: ^6.0.3
  pin_input_text_field: ^4.5.2
  youtube_player_flutter: ^9.0.3
  audioplayers: ^6.1.0
#  assets_audio_player: ^3.0.4+1
  html_unescape: ^2.0.0

  # New dependencies for API integration
  go_router: ^14.0.0
  web_socket_channel: ^2.4.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  cached_network_image: ^3.3.0
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  intl: ^0.20.2

  # SF brand fonts (Phase 0 — Spec Lock & Branding Tokens).
  # Provides DM Sans, DM Serif Display, and DM Mono on demand.
  google_fonts: ^6.2.1

  # In-app WebView for Midtrans Snap payment
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
#  integration_test:
#    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/gifs/
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: OpenSans
      fonts:
        - asset: fonts/OpenSans-Bold.ttf
        - asset: fonts/OpenSans-ExtraBold.ttf
        - asset: fonts/OpenSans-Regular.ttf
        - asset: fonts/OpenSans-SemiBold.ttf

    - family: Bebasneue
      fonts:
        - asset: fonts/bebasneue_regular.TTF
    - family: MeriendaOne
      fonts:
        - asset: fonts/MeriendaOne-Regular.ttf
    - family: SecularOne
      fonts:
        - asset: fonts/SecularOne-Regular.ttf

    - family: ReemKufi
      fonts:
        - asset: fonts/ReemKufi-Bold.ttf

    - family: SFProText
      fonts:
        - asset: fonts/SFProText-Bold.otf
        - asset: fonts/SFProText-Medium.otf
        - asset: fonts/SFProText-Regular.otf
        - asset: fonts/SFProText-Extra_Bold.ttf


  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true
